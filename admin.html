<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio Studio · Admin</title>
  <link rel="icon" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/assets/fonts/fonts.css"><link rel="stylesheet" href="/styles/admin.css">
</head>
<body>
  <main id="login-screen" class="login-screen">
    <div class="login-card">
      <div class="studio-mark">P<span>·</span></div>
      <p class="eyebrow">PORTFOLIO STUDIO</p><h1>Your work.<br>Your story.</h1>
      <p class="intro-copy">Sign in to shape your portfolio.</p>
      <form id="login-form">
        <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="error" role="alert"></p>
        <button class="primary" type="submit" id="login-button">Sign in</button>
      </form>
      <a class="back-link" href="/">View portfolio</a><p class="local-note">Your local creative workspace</p>
    </div>
  </main>
  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar">
      <a class="studio-brand" href="/admin">Portfolio<span> Studio</span></a>
      <p class="sidebar-caption">YOUR WEBSITE</p><nav id="editor-nav" aria-label="Editor sections"></nav>
      <div class="sidebar-bottom"><p id="account-email"></p><button id="logout" class="text-button" type="button">Sign out</button></div>
    </aside>
    <main class="studio-main">
      <header class="studio-header"><div><p class="eyebrow">PORTFOLIO EDITOR</p><span id="save-status" role="status" aria-live="polite">All changes saved</span></div>
        <div class="header-actions"><button id="quick-post" class="secondary" type="button">Quick post</button><a class="secondary" href="/" target="_blank" rel="noopener">View portfolio</a><button id="save" class="primary" type="button">Save changes</button></div>
      </header>
      <div class="editor-wrap"><div class="editor-heading"><div><h1 id="editor-title">Identity & website</h1><p id="editor-description">Make this portfolio yours.</p></div><button id="discard" class="text-button" type="button" hidden>Discard unsaved changes</button></div>
        <p id="editor-error" class="error" role="alert"></p><form id="editor-form" novalidate></form>
      </div>
    </main>
  </div>
  <script src="/scripts/admin.js" type="module"></script>
</body>
</html>
